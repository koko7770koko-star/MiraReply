name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      # 通常版（Gemmaは初回にアプリ内で自動ダウンロード）
      - name: Build APK (lite)
        run: gradle :app:assembleDebug --stacktrace && cp app/build/outputs/apk/debug/app-debug.apk MiraReply.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiraReply-apk
          path: MiraReply.apk
